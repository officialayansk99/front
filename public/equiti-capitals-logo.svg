<svg width="320" height="96" viewBox="0 0 320 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Equiti Capitals">
  <!-- Tile + sliced E, drawn on a 96 grid and scaled to 72 -->
  <g transform="translate(8 12) scale(0.75)">
    <rect width="96" height="96" rx="22" fill="#0b0b0d"/>
    <rect x="24" y="22" width="12" height="52" fill="#83cfc1"/>
    <polygon points="24,22 76,22 69.1,34 24,34" fill="#83cfc1"/>
    <polygon points="24,42 64.5,42 57.5,54 24,54" fill="#83cfc1"/>
    <polygon points="24,62 52.9,62 46,74 24,74" fill="#83cfc1"/>
  </g>

  <!-- Wordmark: the full name on one line. textLength pins the width in
       browsers; rasterisers ignore it and use the natural width. -->
  <text x="96" y="59" textLength="210" lengthAdjust="spacingAndGlyphs"
        font-size="30" font-family="Inter, Arial, sans-serif" font-weight="800" fill="#14140f">Equiti Capitals</text>
</svg>
