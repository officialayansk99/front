<svg width="240" height="96" viewBox="0 0 240 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Equiti Capitals">
  <!-- Rising bars mark — sapphire -->
  <rect x="14" y="52" width="16" height="30" rx="5" fill="#245be0" opacity="0.55"/>
  <rect x="38" y="34" width="16" height="48" rx="5" fill="#245be0" opacity="0.8"/>
  <rect x="62" y="14" width="16" height="68" rx="5" fill="#245be0"/>

  <!-- Wordmark. textLength pins the width in browsers; letter-spacing lands at
       roughly the same width for rasterisers, which ignore textLength. -->
  <text x="96" y="55" textLength="132" lengthAdjust="spacing" letter-spacing="0"
        font-size="36" font-family="Fraunces, Georgia, serif" font-weight="800" fill="#0f1a2e">EQUITI</text>
  <text x="98" y="76" textLength="86" lengthAdjust="spacing" letter-spacing="3.9"
        font-size="11" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#1d4ed8">CAPITALS</text>
</svg>
